<section class="method-section container"><div><span class="eyebrow">THE MIRRA METHOD</span><h2>Science-minded.<br><em>Human-centered.</em></h2><p>Personality exists on a spectrum, not in a box. MIRRA combines familiar psychological dimensions with reflective, everyday questions designed to spark useful conversations about who you are.</p><button class="text-link method-link" data-action="method">Our approach <span>↗</span></button></div><div class="method-list"><div class="method-row"><b>01</b><span>Thoughtful questions</span><small>↗</small></div><div class="method-row"><b>02</b><span>Dimensional patterns</span><small>↗</small></div><div class="method-row"><b>03</b><span>Meaningful interpretation</span><small>↗</small></div><div class="method-row"><b>04</b><span>Reflection that continues</span><small>↗</small></div></div></section>
<section class="journal-preview container"><div><span class="eyebrow">YOUR PRIVATE SPACE</span><h2>Make room<br>for <em>reflection.</em></h2><p>Understanding yourself isn't a one-time result. Create a quiet record of what you're noticing, feeling, and learning as you go.</p>${button('Open your journal','journal','outline')}</div><div class="journal-paper"><div class="paper-top"><span>THE DAILY REFLECTION</span><span>VOL. 01 / MIRRA</span></div><blockquote>“What part of myself have I been overlooking lately?”</blockquote><div class="paper-bottom">A little curiosity can change a lot. ↗</div></div></section></div>`}
function startAssessment(m){mode=m;index=Math.min((data.answers[m]||[]).length,m==='personality'?prompts.length-1:variants[m].questions.length-1);switchScreen('assessment')}
function itemCount(){return mode==='personality'?prompts.length:variants[mode].questions.length}

function selectChoice(v){data.answers[mode][index]=v;persist();render()}
function nextQuestion(){if(!getAnswers()[index]){showToast('Choose the response that feels closest to you.');return}if(index===itemCount()-1){finishAssessment();return}index++;render();}
function finishAssessment(){const arr=getAnswers();if(arr.length<itemCount()||arr.slice(0,itemCount()).some(a=>!a)){showToast('Complete each reflection to see your profile.');return}const created=new Date().toISOString();let result;if(mode==='personality'){let scores={};five.forEach(d=>{const items=prompts.filter(p=>p.dim===d.id);const mean=items.reduce((sum,p)=>sum+(p.reverse?6-arr[p.id-1]:arr[p.id-1]),0)/items.length;scores[d.id]=Math.round((mean-1)*25)});let sorted=[...five].sort((a,b)=>scores[b.id]-scores[a.id]);result={type:'personality',scores,primary:sorted[0].name,created}}else{let tally=[0,0,0,0];arr.slice(0,itemCount()).forEach(v=>{tally[v-1]++});let idx=tally.indexOf(Math.max(...tally));result={type:mode,tally,leader:idx,title:variants[mode].labels[idx],description:variants[mode].descriptions[idx],created}}data.results[mode]=result;persist();switchScreen('results')}
function bar(name,value,desc){return `<div class="report-row"><div class="report-row-top"><span>${name}</span><b>${value}/100</b></div><div class="track"><span style="width:${value}%"></span></div><div class="report-row-desc">${desc}</div></div>`}
function resultSummary(m){let r=data.results[m];if(!r)return '';if(m==='personality')return `MIRRA Personality Atlas — ${five.map(d=>d.name+': '+r.scores[d.id]+'/100').join(' · ')}. Reflective and non-diagnostic.`;return `MIRRA ${variants[m].title} — ${r.title}. ${r.description} Reflective and non-diagnostic.`}
function resultsHTML(){let r=data.results[mode];if(!r)return profileHTML();let personality=mode==='personality';let title=personality?'A portrait of <em>you.</em>':mode==='relationships'?'How you <em>connect.</em>':'How you <em>choose.</em>';let dominant=personality?[...five].sort((a,b)=>r.scores[b.id]-r.scores[a.id])[0]:null;let summary=personality?'Your answers suggest different strengths across five dimensions. Each one is a tendency, not a definition of who you are.':r.description;return `<div class="page"><div class="container page-head"><button class="back-link" data-action="home">← <span>Back to discoveries</span></button><span class="page-breadcrumb">YOUR PERSONAL MIRRA PROFILE</span></div><section class="result-top container"><div><span class="eyebrow">YOUR REFLECTION / ${mode.toUpperCase()}</span><h1>${title}</h1><p>${summary}</p><div class="result-meta"><span class="meta-item">PRIVATE ON THIS DEVICE</span><span class="meta-item">${new Date(r.created).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span><span class="meta-item">PERSONAL INSIGHT</span></div></div><div class="result-panel"><span class="eyebrow">${personality?'YOUR STRONGEST REPORTED DIMENSION':'YOUR MOST CHOSEN STYLE'}</span>${personality?`<div class="result-hero-score">${r.scores[dominant.id]}<span style="font:400 21px var(--display)"> / 100</span></div><h2 style="font:400 31px var(--display);margin:0">${dominant.name}</h2><p>${dominant.short}. Your profile reflects only the answers you chose today.</p>`:`<h2 style="font:400 50px/1 var(--display);margin:28px 0">${r.title}</h2><p>${r.description}</p>`}</div></section><section class="results-grid container"><div class="trait-report"><h2>${personality?'Your five dimensions.':'Your approach, in perspective.'}</h2>${personality?five.map(d=>bar(d.name,r.scores[d.id],d.short)).join(''):variants[mode].labels.map((label,i)=>bar(label,Math.round(100*r.tally[i]/itemCount()),'Share of responses in this reflection')).join('')}</div><div class="insight-report"><span class="small-label">PERSONAL INSIGHTS</span><h2>What your answers might mean.</h2>${personality?[...five].sort((a,b)=>r.scores[b.id]-r.scores[a.id]).slice(0,3).map(d=>`<div class="insight-item"><b>${d.name}</b><p>${r.scores[d.id]>=50?d.high:d.low}</p></div>`).join(''):`<div class="insight-item"><b>${r.title}</b><p>${r.description}</p></div><div class="insight-item"><b>A question to take with you</b><p>When does this style help you, and when could a different approach serve you better?</p></div>`}</div></section><section class="container result-bottom"><div class="disclaimer">MIRRA's current assessments are exploratory self-reflection tools, not validated psychological tests, clinical diagnoses, or predictions of compatibility.</div><div class="result-actions">${button('Copy my summary','copy-summary','outline')}${button('Print / Save as PDF','print','outline')}${button('Explore another journey','home','dark')}</div></section></div>`}
function methodHTML(){return `<div class="page"><section class="page-banner container"><span class="eyebrow">BEHIND THE EXPERIENCE</span><h1>Curiosity meets<br><em>clarity.</em></h1><p>Understanding people takes more than assigning a type. We draw inspiration from established dimensional psychology, then make room for reflection and the complexities of real life.</p></section><section class="container method-grid"><article class="method-card"><span class="m-number">01 / FOUNDATION</span><h2>Beyond labels.</h2><p>The five-factor model describes traits along dimensions rather than placing people into rigid personality categories. MIRRA's exploratory questionnaire organizes reflection around these dimensions.</p></article><article class="method-card"><span class="m-number">02 / EXPRESSION</span><h2>Real-life context.</h2><p>Our relationship and decision experiences use scenario-based prompts to surface the approaches people prefer. They are invitations to reflect, not scientifically validated classifications.</p></article><article class="method-card"><span class="m-number">03 / OWNERSHIP</span><h2>Your inner world.</h2><p>Your answers and journal entries are stored locally in this browser in the current prototype. You can return to your results without creating an account or sharing your private reflections.</p></article></section><section class="method-full container"><span class="eyebrow">A NOTE ON THE SCIENCE</span><h3>Personality is complex. So are you.</h3><p>The personality atlas uses original short-form reflection items influenced by Big Five dimensions. It has not undergone psychometric validation; scores indicate how you answered this particular set of questions and should not be interpreted as clinical findings. Future versions can use formally validated instruments with proper scoring and norms.</p>${button('Begin exploring','start-personality','outline')}</section></div>`}
function journalHTML(){const entries=(data.journal||[]).slice().reverse();return `<div class="page container journal-page"><div class="journal-header"><div><span class="eyebrow">A PRIVATE PRACTICE</span><h1>Room to <em>reflect.</em></h1></div><p>Notice something, write it down, and return when you need perspective. A quiet space for your own thoughts.</p></div><div class="journal-layout"><div class="journal-compose"><div class="small-label">TODAY'S THOUGHT</div><label for="journal-text">What have you been noticing about yourself lately?</label><textarea id="journal-text" placeholder="Write freely. No perfect words required..."></textarea><div class="compose-foot"><small>Saved on this device only.</small>${button('Save reflection','save-journal','dark')}</div></div><div class="journal-history"><div class="small-label">YOUR REFLECTIONS</div><h2>Recent entries.</h2>${entries.length?entries.map(x=>`<article class="entry"><time>${new Date(x.date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</time><p>${escapeHTML(x.content)}</p></article>`).join(''):`<div class="empty-state">Every journal begins with<br>one honest sentence.</div>`}</div></div></div>`}
function profileHTML(){const types=Object.keys(data.results).filter(k=>data.results[k]);if(!types.length)return `<div class="page profile-empty"><span class="eyebrow">YOUR PERSONAL SPACE</span><h1>Your story starts<br>with <em style="color:var(--rust)">curiosity.</em></h1><p>Your reflections will appear here once you complete a journey. No account is required to begin.</p>${button('Start your first reflection','start-personality','dark')}</div>`;return `<div class="page"><section class="page-banner container"><span class="eyebrow">YOUR PERSONAL SPACE</span><h1>Collected<br><em>reflections.</em></h1><p>Your recent MIRRA journeys, kept together in this browser.</p></section><section class="chapter container"><div class="journey-grid">${types.map((m,i)=>`<article class="journey" style="min-height:300px" data-action="view-${m}" role="button" tabindex="0"><div class="journey-head"><span class="journey-index">${String(i+1).padStart(2,'0')} / COMPLETED</span><h3>${m==='personality'?'Personality Atlas':variants[m].title}</h3><p>${new Date(data.results[m].created).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</p></div><div class="journey-bottom"><span>VIEW MY REFLECTION</span><span class="round-arrow">↗</span></div></article>`).join('')}</div></section></div>`}
function eventAction(action){if(action==='home'){switchScreen('home');return}if(action==='start-personality'){startAssessment('personality');return}if(action==='start-relationships'){startAssessment('relationships');return}if(action==='start-decisions'){startAssessment('decisions');return}if(action==='method'||action==='journal'){switchScreen(action);return}if(action==='previous'){if(index>0){index--;render()}else switchScreen('home');return}if(action==='next'){nextQuestion();return}if(action.startsWith('view-')){mode=action.slice(5);switchScreen('results');return}if(action==='copy-summary'){const txt=resultSummary(mode);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>showToast('Profile summary copied.')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt);return}if(action==='print'){window.print();return}if(action==='save-journal'){let el=document.querySelector('#journal-text');let content=el?.value.trim();if(!content){showToast('Write a few words before saving.');return}data.journal.push({date:new Date().toISOString(),content});persist();render();showToast('Reflection saved on this device.');return}}
function fallbackCopy(t){const el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();try{document.execCommand('copy');showToast('Profile summary copied.')}catch(e){showToast('Copying was not available in this browser.')}el.remove()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){eventAction(a.dataset.action);return}const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='relationships')startAssessment('relationships');else switchScreen(nav.dataset.nav==='discover'?'home':nav.dataset.nav);return}const tab=e.target.closest('[data-tab]');if(tab){overviewTab=tab.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===overviewTab));document.querySelector('#preview-chart').innerHTML=sampleChart();return}const opt=e.target.closest('[data-choice]');if(opt){selectChoice(Number(opt.dataset.choice));return}});
document.addEventListener('keydown',e=>{if(e.target.closest('textarea,input'))return;if(screen==='assessment'){const n=mode==='personality'?5:4;if(/^[1-5]$/.test(e.key)&&Number(e.key)<=n){selectChoice(Number(e.key));return}if(e.key==='Enter'&&getAnswers()[index]){nextQuestion();return}}if((e.key==='Enter'||e.key===' ')&&document.activeElement.dataset.action){e.preventDefault();eventAction(document.activeElement.dataset.action)}});
document.querySelector('#brand').addEventListener('click',e=>{e.preventDefault();switchScreen('home')});document.querySelector('#profile-btn').addEventListener('click',()=>switchScreen('profile'));document.querySelector('#header-start').addEventListener('click',()=>startAssessment('personality'));
render();
</script>
<script defer src="/enhancements.js"></script>
</body></html>
