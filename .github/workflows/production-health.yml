name: MIRRA production health
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public website and database API
        shell: bash
        run: |
          set -euo pipefail
          base="https://mirra-psychology-web-production.up.railway.app"
          ready=0
          for n in $(seq 1 3); do
            if curl --max-time 12 --fail --silent --show-error "$base/api/health" -o /tmp/mirra-health.json &&
               curl --max-time 12 --fail --silent --show-error "$base/" -o /tmp/mirra-home.html &&
               curl --max-time 12 --fail --silent --show-error "$base/app.js" -o /tmp/mirra-app.js; then
              if node -e "const fs=require('fs');let h=JSON.parse(fs.readFileSync('/tmp/mirra-health.json','utf8'));const home=fs.readFileSync('/tmp/mirra-home.html','utf8'),app=fs.readFileSync('/tmp/mirra-app.js','utf8');console.log('PROBE',JSON.stringify({health:h,htmlLength:home.length,scriptLength:app.length,hasBrand:home.includes('MIRRA'),hasBigFive:app.includes('Big Five')}));if(h.ok!==true||h.database!==true||!home.includes('MIRRA')||!app.includes('Big Five'))process.exit(1)"; then
                echo "MIRRA production verified: website, JavaScript, API and connected database"
                ready=1
                break
              else
                echo "Production endpoints returned unexpected content, retrying"
              fi
            fi
            sleep 2
          done
          test "$ready" -eq 1

      - name: Verify shared experience route and assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://mirra-psychology-web-production.up.railway.app"
          for n in $(seq 1 18); do
            if curl --max-time 15 --fail --silent --show-error "$base/q/emotions?utm_source=ci_probe" -o /tmp/mirra-share.html &&
               grep -q 'href="/styles.css"' /tmp/mirra-share.html &&
               grep -q 'src="/app.js"' /tmp/mirra-share.html &&
               curl --max-time 15 --fail --silent --show-error "$base/styles.css" -o /dev/null &&
               curl --max-time 15 --fail --silent --show-error "$base/app.js" -o /dev/null &&
               curl --max-time 15 --fail --silent --show-error "$base/favicon.svg" -o /dev/null; then
              echo "SHARED LINK VERIFIED: /q/emotions, CSS, JS, favicon"
              exit 0
            fi
            sleep 5
          done
          echo "SHARED LINK BROKEN"; exit 1
      - name: Report aggregate first-circle activation (not unique verified users)
        shell: bash
        run: |
          set -euo pipefail
          base="https://mirra-psychology-web-production.up.railway.app"
          curl --max-time 20 --fail --silent --show-error "$base/api/funnel/summary" -o /tmp/mirra-growth.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/mirra-growth.json","utf8")); const fields=["windowDays","anonymous_browsers","started_browsers","engaged_browsers","completed_browsers","returning_browsers","sharing_browsers","firstCircleOptIns"]; const safe=Object.fromEntries(fields.map(k=>[k,x[k]??null])); console.log("MIRRA AGGREGATE FUNNEL",JSON.stringify(safe)); console.log("NOTE: Browser identifiers and opt-ins are not independently verified people.");'
