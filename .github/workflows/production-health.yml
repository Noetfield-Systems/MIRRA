name: MIRRA production health
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public DNS, TLS and access without Vercel login
        shell: bash
        run: |
          set -euo pipefail
          host="mirra-psychology.vercel.app"
          getent ahostsv4 "$host" | head -5
          curl --retry 2 --retry-delay 2 --max-time 25 --location --fail --show-error --silent --dump-header /tmp/mirra-public-headers "https://$host/" -o /tmp/mirra-public-check.html
          sed -n '1,17p' /tmp/mirra-public-headers
          grep -q 'MIRRA' /tmp/mirra-public-check.html
          if grep -qiE 'Vercel Authentication|Login to Vercel|Deployment Protection|Authentication Required' /tmp/mirra-public-check.html; then
            echo "UNEXPECTED_DEPLOYMENT_PROTECTION"
            exit 1
          fi
          echo "MIRRA_ANONYMOUS_EXTERNAL_ACCESS_PASS"
      - name: Verify public Vercel pages, assets and guest API
        shell: bash
        run: |
          set -euo pipefail
          base="https://mirra-psychology.vercel.app"
          for try in 1 2 3 4 5; do
            if curl --max-time 20 --fail --silent --show-error "$base/api/health" -o /tmp/mirra-health.json &&
               curl --max-time 20 --fail --silent --show-error "$base/api/config" -o /tmp/mirra-config.json &&
               curl --max-time 20 --fail --silent --show-error "$base/api/me" -o /tmp/mirra-me.json &&
               curl --max-time 20 --fail --silent --show-error "$base/" -o /tmp/mirra-home.html &&
               curl --max-time 20 --fail --silent --show-error "$base/q/emotions?utm_source=ci_probe" -o /tmp/mirra-share.html &&
               curl --max-time 20 --fail --silent --show-error "$base/styles.css" -o /dev/null &&
               curl --max-time 20 --fail --silent --show-error "$base/premium.css" -o /dev/null &&
               curl --max-time 20 --fail --silent --show-error "$base/app.js" -o /tmp/mirra-app.js &&
               curl --max-time 20 --fail --silent --show-error "$base/experience-curriculum.js" -o /dev/null &&
               curl --max-time 20 --fail --silent --show-error "$base/ipip-items.json" -o /dev/null &&
               curl --max-time 20 --fail --silent --show-error "$base/assets/portrait.webp" -o /dev/null &&
               curl --max-time 20 --fail --silent --show-error "$base/favicon.svg" -o /dev/null; then
                node - <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('/tmp/mirra-health.json','utf8'));
          const config=JSON.parse(fs.readFileSync('/tmp/mirra-config.json','utf8'));
          const me=JSON.parse(fs.readFileSync('/tmp/mirra-me.json','utf8'));
          const html=fs.readFileSync('/tmp/mirra-home.html','utf8');
          const share=fs.readFileSync('/tmp/mirra-share.html','utf8');
          const app=fs.readFileSync('/tmp/mirra-app.js','utf8');
          if(health.ok!==true||!html.includes('MIRRA')||!html.includes('/premium.css')||!html.includes('bottom-nav')||!share.includes('/app.js')||!app.includes('localInviteRead')||!Object.hasOwn(config,'accounts')||!Object.hasOwn(me,'user'))process.exit(1);
          console.log('MIRRA_PUBLIC_PROBE_PASS',JSON.stringify({host:'Vercel',website:true,css:true,js:true,guestAPI:true,database:health.database,ai:health.ai,accountRegistration:config.accounts}));
          if(!health.database)console.log('CAPABILITY_LIMIT: cloud accounts, real Together persistence, First Circle collection, and aggregate analytics remain off. Browser-local Together is available.');
          NODE
                exit 0
            fi
            sleep 5
          done
          echo "MIRRA_PRODUCTION_PUBLIC_PROBE_FAILED"
          exit 1
