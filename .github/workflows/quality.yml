name: MIRRA quality checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirra_test
          POSTGRES_PASSWORD: mirra_test
          POSTGRES_DB: mirra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate frontend, scoring, and static server
        run: npm test
      - name: Verify complete real database journey
        run: node --test test/api.integration.test.cjs
        env:
          MIRRA_TEST_DATABASE_URL: postgres://mirra_test:mirra_test@localhost:5432/mirra_test
      - name: Install Chromium for realistic synthetic journeys
        run: npx playwright install --with-deps chromium
      - name: Start disposable local MIRRA for synthetic personas
        env:
          DATABASE_URL: postgres://mirra_test:mirra_test@127.0.0.1:5432/mirra_test
          MIRRA_SYNTHETIC_LAB: "1"
          NODE_ENV: test
          PORT: "3000"
        run: |
          (node server.js > /tmp/mirra-synthetic-server.log 2>&1 &)
          for n in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:3000/api/health >/tmp/mirra-lab-health.json; then
              node -e 'const x=require("/tmp/mirra-lab-health.json");if(!x.database)process.exit(1)'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mirra-synthetic-server.log
          exit 1
      - name: Execute eight isolated behavioral QA personas
        run: npm run test:synthetic
      - name: Assert synthetic personas did not enter real-user analytics
        if: always()
        env:
          DATABASE_URL: postgres://mirra_test:mirra_test@127.0.0.1:5432/mirra_test
        run: |
          node - <<'NODE'
          const {Pool}=require('pg');
          (async()=>{const p=new Pool({connectionString:process.env.DATABASE_URL});
          try{const x=await p.query('SELECT count(*)::int n FROM mirra_funnel_events');
          console.log('SYNTHETIC_ANALYTICS_ISOLATION',x.rows[0]);
          if(x.rows[0].n!==0)process.exitCode=1;
          }finally{await p.end()}})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Preserve simulated user traces, critical findings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirra-synthetic-user-lab-${{ github.run_id }}
          path: |
            artifacts/synthetic-lab/
            /tmp/mirra-synthetic-server.log
          if-no-files-found: ignore
          retention-days: 21
